name: Build signed toolstokeep direct edition

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in Config/Version.xcconfig'
        required: true
        default: '1.8.1'
        type: string

permissions:
  contents: read

concurrency:
  group: today-md-direct-1.8.4-a302078-intel
  cancel-in-progress: false

jobs:
  direct:
    runs-on: macos-15-intel
    timeout-minutes: 60
    environment: macos-rehearsal
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DIRECT_VERSION: ${{ inputs.version }}
      TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
    steps:
      - name: Check out the exact signing source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the app and direct-release script
        run: |
          swift test --package-path apps/todaymd/apps/macos
          swift test --package-path packages/ToolsToKeepKit
          bash -n apps/todaymd/apps/macos/scripts/build-direct.sh

      - name: Prepare isolated signing, build, and notarize
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          set +vx
          umask 077
          work_dir=$(mktemp -d "$RUNNER_TEMP/today-md-direct-signing.XXXXXX")
          keychain="$work_dir/signing.keychain-db"
          cleanup() {
            local status=$?
            if [[ -f "$work_dir/original-keychains.json" ]]; then
              python3 - "$work_dir/original-keychains.json" <<'PY' || true
          import json, subprocess, sys
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *json.load(open(sys.argv[1]))], check=True)
          PY
            fi
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work_dir"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          security list-keychains -d user | python3 -c 'import json,shlex,sys; json.dump(shlex.split(sys.stdin.read()),sys.stdout)' > "$work_dir/original-keychains.json"
          python3 - "$work_dir" <<'PY'
          import base64, os, pathlib, sys
          for name in ("MACOS_SIGNING_P12", "MACOS_SIGNING_P12_PASSWORD", "ASC_PRIVATE_KEY_P8", "ASC_KEY_ID", "ASC_ISSUER_ID", "TEAM_ID"):
              if not os.environ.get(name):
                  sys.exit("Missing signing configuration: " + name)
          directory=pathlib.Path(sys.argv[1])
          (directory / "certificate.p12").write_bytes(base64.b64decode(os.environ["MACOS_SIGNING_P12"].strip(), validate=True))
          (directory / "AuthKey.p8").write_text(os.environ["ASC_PRIVATE_KEY_P8"])
          PY
          keychain_password=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work_dir/certificate.p12" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          python3 - "$work_dir/original-keychains.json" "$keychain" <<'PY'
          import json, subprocess, sys
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", sys.argv[2], *json.load(open(sys.argv[1]))], check=True)
          PY
          unset MACOS_SIGNING_P12 MACOS_SIGNING_P12_PASSWORD ASC_PRIVATE_KEY_P8 keychain_password
          CODESIGN_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | python3 -c '
          import os,re,sys
          identities=re.findall(r"([A-F0-9]{40}) \"Developer ID Application: [^\"]+ \(" + re.escape(os.environ["TEAM_ID"]) + r"\)\"",sys.stdin.read())
          if len(identities) != 1:
              sys.exit("Import exactly one valid Developer ID Application identity for TEAM_ID")
          print(identities[0])')
          CODESIGN_KEYCHAIN="$keychain"
          NOTARY_KEY_FILE="$work_dir/AuthKey.p8"
          export CODESIGN_IDENTITY CODESIGN_KEYCHAIN NOTARY_KEY_FILE
          bash apps/todaymd/apps/macos/scripts/build-direct.sh "$DIRECT_VERSION"

      - name: Retain verified direct-release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: today-md-direct-${{ inputs.version }}
          path: |
            apps/todaymd/apps/macos/build/direct/${{ inputs.version }}/*.zip
            apps/todaymd/apps/macos/build/direct/${{ inputs.version }}/release.json
            apps/todaymd/apps/macos/build/direct/${{ inputs.version }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Retain Apple notarization diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: today-md-direct-notarization-${{ github.run_id }}
          path: apps/todaymd/apps/macos/build/direct/${{ inputs.version }}/diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 7
