name: Release macOS app

on:
  push:
    branches: ['codex/rehearse-macos-*']
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag (vX.Y.Z)'
        required: true
        type: string
      publish:
        description: 'Publish after verification (leave off for a signing rehearsal)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-stable-release
  cancel-in-progress: false

jobs:
  validate-publication-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Reject publication from a non-tag ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Publishing requires dispatching the workflow from an existing version tag.' >&2
            exit 1
          fi

  release:
    needs: validate-publication-ref
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'codex/rehearse-macos-') && 'macos-rehearsal' || 'macos-release' }}
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare a local version tag for the branch rehearsal
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          version=$(python3 apps/macos/scripts/release-metadata.py project-version --short)
          rehearsal_tag="v$version"
          if [[ ! "$rehearsal_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'The rehearsal needs a stable MARKETING_VERSION in the form X.Y.Z.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'The rehearsal checkout must match the triggering commit.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$rehearsal_tag"; then
            if [[ "$(git rev-parse "refs/tags/$rehearsal_tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo 'The existing version tag points to another commit. Bump the version before rehearsing.' >&2
              exit 1
            fi
          else
            git -c tag.gpgSign=false tag "$rehearsal_tag" "$GITHUB_SHA"
          fi
          printf 'RELEASE_TAG=%s\n' "$rehearsal_tag" >> "$GITHUB_ENV"

      - name: Verify release scripts
        run: |
          xcodebuild -version
          swift test --package-path apps/macos
          python3 -m unittest discover -s apps/macos/scripts/tests -v
          bash -n apps/macos/scripts/release-macos.sh
          bash -n apps/macos/scripts/publish-macos-release.sh
          bash -n apps/macos/scripts/verify-sparkle-release.sh

      - name: Build, sign, notarize, and verify
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash apps/macos/scripts/release-macos.sh

      - name: Retain verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: today-md-${{ env.RELEASE_TAG }}-macos
          path: |
            dist/macos/*.zip
            dist/macos/appcast.xml
            dist/macos/release.json
            dist/macos/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Retain notarization diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: today-md-notarization-${{ github.run_id }}
          path: dist/macos/diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish verified assets and update feed
        if: github.ref_type == 'tag' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        run: bash apps/macos/scripts/publish-macos-release.sh
